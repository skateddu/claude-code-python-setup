version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: uv
    directory: /.claude/skills/fastapi-patterns/example
    schedule:
      interval: weekly
    groups:
      fastapi-example:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
