name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Shellcheck hooks
        run: shellcheck --severity=warning .claude/hooks/*.sh

      - name: Test hook behaviour
        run: uv run pytest

      - name: Test the fastapi-patterns example
        working-directory: .claude/skills/fastapi-patterns/example
        run: |
          uv run --locked --python 3.10 python -m pytest -q -W error
          uv run --locked ruff check .

  test-windows:
    name: Test hooks on Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Test hook behaviour
        run: uv run pytest

  test-macos:
    name: Test hooks on macOS
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Show the bash that runs the hooks
        run: bash --version | head -n 1

      - name: Test hook behaviour
        run: uv run pytest
