[project]
name = "my-app"
version = "0.1.0"
description = "Example user API for the fastapi-patterns skill"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncpg",
    "fastapi",
    "pwdlib[argon2]",
    "pydantic-settings",
    "pydantic[email]",
    "pyjwt",
    "python-multipart",
    "sqlalchemy[asyncio]",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite",
    "httpx",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["my_app", "tests"]
force-sort-within-sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: marks tests requiring external services"]
addopts = "--strict-markers"
